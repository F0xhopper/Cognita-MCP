[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognita-mcp"
version = "1.0.0"
description = "Book Intelligence MCP — personal library search and retrieval for AI agents"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",

    # Database
    "asyncpg>=0.30.0",
    "pgvector>=0.3.5",

    # MCP
    "mcp[cli]>=1.9.0",

    # Auth
    "PyJWT>=2.9.0",
    "cryptography>=43.0.0",

    # Embeddings / AI
    "openai>=1.54.0",
    "mistralai>=1.2.0",
    "anthropic>=0.40.0",

    # Document parsing
    "pypdf>=5.1.0",
    "ebooklib>=0.18.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",

    # HTTP client (URL-based book import)
    "httpx>=0.27.0",

    # Config / utils
    "python-dotenv>=1.0.1",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "faker>=30.0.0",
]

[project.scripts]
cognita-api = "cognita.main:run"
cognita-mcp = "cognita.tools.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/cognita"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/cognita"]
omit = ["*/migrations/*"]

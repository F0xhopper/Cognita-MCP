[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognita-mcp"
version = "2.0.0"
description = "An MCP server that lets your agent search your personal library"
requires-python = ">=3.12"
dependencies = [
    # MCP server + HTTP transport.
    # Capped below 2.0: that release renames mcp.server.fastmcp to
    # mcp.server.mcpserver and reshapes the server API. Lift the cap only
    # together with the migration.
    "mcp[cli]>=1.12.0,<2.0.0",
    "uvicorn[standard]>=0.32.0",
    "starlette>=0.41.0",

    # Database
    "asyncpg>=0.30.0",
    "pgvector>=0.3.5",

    # Embeddings (required)
    "openai>=1.54.0",

    # Optional quality features — the server runs without their API keys
    "anthropic>=0.40.0",
    "mistralai>=1.2.0",

    # Document parsing
    "pypdf>=5.1.0",
    "ebooklib>=0.18.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",

    # Downloading books
    "httpx>=0.27.0",

    # Config
    "python-dotenv>=1.0.1",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
cognita = "cognita.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/cognita"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/cognita"]

services:
  api:
    build: .
    command: cognita-api
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
    restart: unless-stopped

  mcp:
    build: .
    command: cognita-mcp
    ports:
      - "8001:8001"
    env_file: .env
    volumes:
      - uploads:/data/uploads
    restart: unless-stopped

  worker:
    build: .
    command: cognita-worker
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  uploads:

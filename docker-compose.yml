services:
  api:
    build: .
    command: cognita-api
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - uploads:/data/uploads
    restart: unless-stopped

  mcp:
    build: .
    command: cognita-mcp
    ports:
      - "8001:8001"
    env_file: .env
    volumes:
      - uploads:/data/uploads
    restart: unless-stopped

volumes:
  uploads:
